services:
  ocr:
    build:
      context: .
      dockerfile: ocr_service/Dockerfile
    environment:
      OCR_MIN_CONFIDENCE: "0.45"
      OCR_MAX_IMAGE_BYTES: "8388608"
    ports:
      - "8790:8790"

  # Kokoro TTS（CPU 版）。首次拉取镜像较大，首次合成会下载模型。
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - "8880:8880"
    restart: unless-stopped

  api:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server/index.mjs"]
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      PORT: "8787"
      OCR_SERVICE_URL: "http://ocr:8790"
      KOKORO_TTS_URL: "http://kokoro:8880"
      KOKORO_VOICE: ${KOKORO_VOICE:-af_heart}
      KOKORO_VOICE_US: ${KOKORO_VOICE_US:-af_heart}
      KOKORO_VOICE_UK: ${KOKORO_VOICE_UK:-bf_emma}
      CORS_ORIGIN: "*"
      YOUDAO_APP_KEY: ${YOUDAO_APP_KEY:-}
      YOUDAO_APP_SECRET: ${YOUDAO_APP_SECRET:-}
      ALIYUN_SMS_ACCESS_KEY: ${ALIYUN_SMS_ACCESS_KEY:-}
      ALIYUN_SMS_SECRET_KEY: ${ALIYUN_SMS_SECRET_KEY:-}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      ALIYUN_SMS_TEMPLATE_LOGIN: ${ALIYUN_SMS_TEMPLATE_LOGIN:-}
      ALIYUN_SMS_TEMPLATE_REGISTER: ${ALIYUN_SMS_TEMPLATE_REGISTER:-}
      WECHAT_MP_APPID: ${WECHAT_MP_APPID:-}
      WECHAT_MP_SECRET: ${WECHAT_MP_SECRET:-}
      SMS_DEBUG: ${SMS_DEBUG:-0}
    ports:
      - "8787:8787"
    depends_on:
      - ocr
      - kokoro
